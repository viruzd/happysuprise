<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada kejutan untukmu</title>
<style>
:root{--bg:#fff1f4;--ink:#3b1030;--soft:#7a4a68;--card:#ffffff;--acc:#e8456f;--accink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22102c;--ink:#ffeef3;--soft:#d9b3c8;--card:#32183f;--acc:#ff7a9c;--accink:#2a0a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#22102c;--ink:#ffeef3;--soft:#d9b3c8;--card:#32183f;--acc:#ff7a9c;--accink:#2a0a1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.s{display:none;width:100%;max-width:440px;text-align:center}
.s.on{display:block}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0 0 14px}
h1{font-size:2.1rem}h2{font-size:1.6rem}
p{margin:0 0 14px;color:var(--soft)}
.big{font-size:4rem;line-height:1;display:block;margin-bottom:16px}
.card{background:var(--card);border-radius:20px;padding:22px;text-align:left;margin:16px 0}
.card p{color:var(--ink)}.card p:last-child{margin:0}
.btn{font:700 1.05rem system-ui,sans-serif;background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:14px 32px;margin-top:8px;cursor:pointer;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--acc)}
.opt{display:block;width:100%;font:700 1rem system-ui,sans-serif;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:16px;margin:10px 0;cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
blockquote{margin:6px 0 14px;padding-left:14px;border-left:3px solid var(--acc);font-style:italic;color:var(--soft)}
.foto{display:block;width:100%;border-radius:14px;margin:0 0 16px}
.opts{margin:16px 0}
.reply{min-height:3.4em;font-family:Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--ink)}
.opt.pick{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.sign{text-align:right;font-style:italic}
</style>
</head>
<body>
<main id="app">

<section class="s on" id="s1">
 <span class="big">💌</span>
 <h1 id="t1"></h1>
 <p>Happy birthday sayanggku, ada sesuatu ni penasaran?</p>
 <button class="btn" id="go">Buka</button>
</section>

 <div class="opts" id="opts"></div>
 <p class="reply" id="reply" aria-live="polite"></p>
 <button class="btn" id="nextq" hidden>Lanjut</button>
</section>

 <h2 id="t3"></h2>

<script>
// ====== UBAH BAGIAN INI ======
var C = {
  nama: "Sayangku",     // panggilan pasanganmu
  dari: "mas Do",        // namamu
  tanya: [
    {q:"Apa warna favoritmu?",
     o:[["Pink","Manis, sama seperti kamu."],["Hitam biru","Tenang dan dalam. Aku suka pilihanmu."],["Putih","Bersih dan sederhana. Cocok buat kamu."]]},
    {q:"Apa yang ingin kamu pilih saat ini?",
     o:[["Coffee","Oke, kopi dulu supaya semangat."],["Chocolate","Manis-manis. Pilihan yang tepat."],["Ice cream","Dingin dan bikin senyum. Setuju."]]},
    {q:"Apa yang ingin kamu lakukan hari ini?",
     o:[["Peluk","Boleh banget. Peluk erat sekarang."],["Tidur","Istirahat dulu, kamu pantas."],["Tidur lagi","Sepuluh menit lagi, ya. Aku tunggu."]]}
  ],
  pesan: [
    "Tidak banyak kata-kata, tapi selalu bisa jadi yang ada makna.",
    "Selamat ulang tahun sayang. Semoga etam ke depannya dapat menjalani ini bersama, saling mengerti dan mencoba memahami satu sama lain. Semoga yang diimpikan tercapai. Aamiin."
  ],
  kutipan: "“We may not have control over how life unfolds, but we have a choice in how we walk through it together.”",
  penutup: "Peluk virtual, erat sekali."
};
// ====== SELESAI ======

function $(i){return document.getElementById(i)}
function show(n){
  document.querySelectorAll(".s").forEach(function(e){e.classList.remove("on")});
  $("s"+n).classList.add("on");window.scrollTo(0,0);
}
$("t1").textContent="Hai, "+C.nama+" 👋";
$("t2").textContent="Selamat ulang tahun, "+C.nama+"!";
var box=$("pesan");
C.pesan.forEach(function(t,i){var p=document.createElement("p");p.textContent=t;if(i===0)p.style.fontWeight="700";box.appendChild(p)});
var q=document.createElement("blockquote");q.textContent=C.kutipan;box.appendChild(q);
var sg=document.createElement("p");sg.className="sign";sg.textContent="Dari "+C.dari;box.appendChild(sg);
$("t3").textContent=C.penutup;
$("end").textContent="Terima kasih sudah membaca sampai habis, love you❤️😘 "+C.nama+".";
var qi=0;
function renderQ(){
  var Q=C.tanya[qi];
  $("q").textContent=Q.q;$("reply").textContent="";$("nextq").hidden=true;
  var box=$("opts");box.innerHTML="";
  Q.o.forEach(function(o){
    var b=document.createElement("button");b.className="opt";b.textContent=o[0];
    b.onclick=function(){
      box.querySelectorAll(".opt").forEach(function(x){x.classList.remove("pick")});
      b.classList.add("pick");$("reply").textContent=o[1];$("nextq").hidden=false;
      $("nextq").textContent=qi<C.tanya.length-1?"Lanjut":"Lihat pesannya";
    };
    box.appendChild(b);
  });
}
$("nextq").onclick=function(){if(qi<C.tanya.length-1){qi++;renderQ()}else{show(2)}};
$("go").onclick=function(){qi=0;renderQ();show("q")};
$("to3").onclick=function(){show(3)};
</script>
